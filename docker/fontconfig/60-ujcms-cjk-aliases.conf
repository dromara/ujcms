<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  中文字体名别名（随镜像复制到 /etc/fonts/conf.d/）。文库的 Office 转 PDF、DOC 导入由 LibreOffice 渲染，
  文档里常见的 Windows 中文字体名在镜像里映射到随镜像安装的开源字体（fonts-noto-cjk，SIL OFL 1.1）：
    宋体 / 新宋体 / 仿宋 / 楷体 → Noto Serif CJK SC（思源宋体）
    黑体 / 微软雅黑 / 等线        → Noto Sans CJK SC（思源黑体）
  Arial / Times New Roman / Courier New / Calibri / Cambria 由 fontconfig 自带的 30-metric-aliases.conf 映射到
  Liberation / Carlito / Caladea，这里不重复。Windows 自带字体的许可不允许随镜像再分发，故镜像不内置它们；
  部署方若持有这些字体的使用许可，可把字体目录挂载到容器的 /usr/share/fonts/ 下，fontconfig 会优先使用真实字体。
-->
<fontconfig>
  <alias binding="same">
    <family>SimSun</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>宋体</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>NSimSun</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>新宋体</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>FangSong</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>仿宋</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>KaiTi</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>楷体</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>SimHei</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>黑体</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>Microsoft YaHei</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>微软雅黑</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>DengXian</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>等线</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
</fontconfig>
