databaseChangeLog:
  - changeSet:
      id: 1783468800000-1
      author: PONY
      changes:
        - createTable:
            columns:
              - column:
                  constraints:
                    nullable: false
                    primaryKey: true
                  name: id_
                  remarks: 好友ID
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
                  name: user_id_
