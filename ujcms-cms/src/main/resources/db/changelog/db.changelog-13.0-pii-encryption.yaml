databaseChangeLog:
  # PII 整列加密（原 11.6 + 11.7——13.0 重整）：
  #
  # 一、ujcms_message_board 联系方式列（联系人/电话/邮箱/地址）改为 MEDIUMTEXT，
  #   以容纳整列 SM4-GCM 密文（由 MessageBoardMapper.xml 上的 Sm4StringTypeHandler 加密）。
  #   这些列不参与任何 WHERE 等值查询，可安全整列加密。
  #
  # 二、用户 PII（手机号 / 邮箱）可搜索加密（blind index 盲索引方案）：
  #   1. ujcms_user.mobile_ / email_ 改为 MEDIUMTEXT，容纳随机 IV 的 SM4-GCM 整列密文
  #      （由 UserMapper.xml 上的 Sm4StringTypeHandler 加密）。
  #   2. 新增 mobile_index_ / email_index_（VARCHAR(64)，存 HMAC-SM3 十六进制盲索引），
  #      并各建一个 UNIQUE 索引，替代原先仅靠应用层的查重，提供 DB 级唯一性。
  #      索引列空值存 NULL（PiiBlindIndex 对空白值返回 null），UNIQUE 下允许大量无手机号 /
  #      邮箱的用户并存。MySQL/MariaDB/PostgreSQL/Kingbase/达梦的 UNIQUE 索引允许多个
  #      NULL；SQL Server 的 UNIQUE 索引只允许单个 NULL——若部署于 SQL Server，需改为
  #      过滤索引（WHERE col IS NOT NULL），本仓库主库为 MySQL，迁移须在目标库上验证。
  #
  # 类型转换不用 modifyDataType：Oracle 系（达梦）禁止 VARCHAR2→CLOB 直接 ALTER（ORA-22858）。
  # 与 db.changelog-13.0-config.yaml 同样按"表里有没有数据"分两条互斥路径：全新建库（表为空）
  # 删列重建；从 12.x 及更早版本升级（表已有行）走 13.0-upgrade-* 逐列"加列-拷贝-删列-改名"
  # 保全留言联系方式与用户手机号/邮箱（即原 11.6 / 11.7 的做法），随后删列重建的变更集 MARK_RAN。
  # 引导脚本以明文写入 mobile_/email_ 属预期：历史明文在下次保存时透明转为密文（懒迁移）。
  # 升级后存量用户的 mobile_/email_ 仍是明文、盲索引列为空：按手机号/邮箱登录、找回密码、查重
  # 都走盲索引，须在升级后调用 POST /api/backend/core/user/rebuild-pii-index 一次性回填
  # （docs/guide/pii-backfill.zh.md），回填前这些功能找不到老用户。

  # ---- 留言板，升级路径（表已有行）：逐列搬移 ----
  - changeSet:
      id: 13.0-upgrade-message-board-contact-to-mediumtext
      author: PONY
      preConditions:
        - onFail: MARK_RAN
        - not:
            - sqlCheck:
                expectedResult: 0
                sql: select count(*) from ujcms_message_board
        - not:
            - changeSetExecuted:
                changeLogFile: db/changelog/db.changelog-13.0-pii-encryption.yaml
                id: 13.0-message-board-contact-to-mediumtext
                author: PONY
      changes:
        - addColumn:
            tableName: ujcms_message_board
            columns:
              - column:
                  name: contact_tmp_
                  type: MEDIUMTEXT
                  remarks: 联系人
        - sql:
            sql: update ujcms_message_board set contact_tmp_ = contact_
        - dropColumn:
            tableName: ujcms_message_board
            columnName: contact_
        - renameColumn:
            tableName: ujcms_message_board
            oldColumnName: contact_tmp_
            newColumnName: contact_
            columnDataType: MEDIUMTEXT
            remarks: 联系人

