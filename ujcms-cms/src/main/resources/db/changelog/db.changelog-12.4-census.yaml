              - column:
                  name: process_text_
                  remarks: 处理说明
                  type: VARCHAR(1500)
              - column:
                  constraints:
                    nullable: false
                  name: created_
                  remarks: 创建日期
                  type: datetime
            remarks: 普查问题
            tableName: ujcms_census_issue
