            indexName: idx_view_history_article
            tableName: ujcms_view_history
  - changeSet:
      id: 1783814400000-5
      author: PONY
      changes:
        - addForeignKeyConstraint:
            baseColumnNames: site_id_
            baseTableName: ujcms_view_history
            constraintName: fk_view_history_site
            deferrable: false
            initiallyDeferred: false
            onDelete: RESTRICT
            onUpdate: RESTRICT
            referencedColumnNames: id_
            referencedTableName: ujcms_site
