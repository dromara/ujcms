databaseChangeLog:
  # 站点设置列统一为 MEDIUMTEXT（13.0 已发布，故以升级变更集实施，全新建库与既有 13.0 库同走此处）：
  #   ujcms_site 的八个 *_settings_ VARCHAR(1000) 列（编辑器/水印/静态页/留言板/评论/依申请公开/领导信箱/在线访谈）
  #   与 census_settings_（TEXT）一并改为 MEDIUMTEXT，同 ujcms_config 在 13.0 的做法：
  #   1. 摆脱 MySQL 单行 65535 字节上限——utf8mb4 VARCHAR(1000) 按声明宽度计 4000 字节，八列合计 32000 字节，
  #      令该表逼近上限（再加一个 VARCHAR(1000) 建表即报 1118），而实际存储的 JSON 仅数十至数百字节；
  #      TEXT 系列只按指针计入行宽，DYNAMIC 行格式下小值仍存于页内，读写无额外开销。
  #   2. 与 ai/geo/accessibility 三个设置列及全库其它大文本列统一为 MEDIUMTEXT（Liquibase 按方言翻译为各库原生 CLOB/TEXT）。
  #   3. 原 VARCHAR(1000) 只是对序列化 JSON 串的人为上限，各设置子对象的校验并不约束它，超长时以 MySQL 1406 落库失败告终。
  #   ujcms_census.settings_ 为 Site.Census 的快照，随源列同型（TEXT → MEDIUMTEXT）。
  #
  # 为什么用“加列-拷贝-删列-改名”而不是 modifyDataType：Oracle 系数据库（达梦 DM）禁止将 VARCHAR2 直接 ALTER 为 CLOB（ORA-22858）。
  # 本迁移仅由 addColumn(MEDIUMTEXT) + UPDATE 赋值 + dropColumn + renameColumn 组成，各步骤已在受支持数据库上验证
  # （原 11.5 配置表迁移同法；DML 中的 VARCHAR→CLOB 隐式赋值在 Oracle 系同样允许）。
  # SiteMapper.xml 相应改为 jdbcType=LONGVARCHAR；生成类去掉 @Length（生成器对 LONGVARCHAR 列不生成该注解）。

  - changeSet:
      id: 13.1-site-editor-settings-to-mediumtext
      author: PONY
      changes:
        - addColumn:
            tableName: ujcms_site
            columns:
              - column:
                  name: editor_settings_tmp_
                  type: MEDIUMTEXT
                  remarks: 编辑器设置
        - sql:
            sql: update ujcms_site set editor_settings_tmp_ = editor_settings_
        - dropColumn:
            tableName: ujcms_site
            columnName: editor_settings_
        - renameColumn:
            tableName: ujcms_site
            oldColumnName: editor_settings_tmp_
            newColumnName: editor_settings_
            columnDataType: MEDIUMTEXT
            remarks: 编辑器设置

