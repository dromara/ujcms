databaseChangeLog:
  # 全局配置列演进（原 11.5 + 11.x-marketplace-connection——13.0 重整）：
  #
  # 一、全部 *_settings_ 列由 VARCHAR 改为 MEDIUMTEXT：
  #   1. 摆脱 MySQL 单行 65535 字节上限——该表 VARCHAR 列在 utf8mb4 下已逼近上限，
  #      继续保留小 VARCHAR 既限制配置体积，也让"整列加密"无法落库。
  #   2. 与全库其它大文本列统一为 MEDIUMTEXT（Liquibase 按方言翻译为各库原生 CLOB/TEXT）。
  #   不用 modifyDataType：Oracle 系数据库（达梦 DM）禁止将 VARCHAR2 直接 ALTER 为 CLOB（ORA-22858）。
  #   两条路径按"表里有没有数据"二选一（互斥的前置条件，同一库只走其一）：
  #     - 全新建库（引导数据脚本在变更日志之后执行，此时表恒为空）：13.0-config-settings-to-mediumtext
  #       直接删旧列、按目标类型重建，一步到位；
  #     - 从 12.x 及更早版本升级（表已有行）：13.0-upgrade-config-*-to-mediumtext 逐列"加列-拷贝-删列-改名"
  #       保全存量设置（即原 11.5 的做法；DML 中 VARCHAR→CLOB 的隐式赋值在 Oracle 系同样允许），
  #       随后 13.0-config-settings-to-mediumtext 标记跳过（MARK_RAN）。
  #   升级变更集另以 changeSetExecuted 排除已经走过全新建库路径的库（13.0 发布后新装的库在
  #   升级到本版本时表已有行，但列早已是 MEDIUMTEXT）。changeLogFile 必须写明：Liquibase 评估前置条件时
  #   传入的是主变更日志（db.changelog-master.yaml），省略即按主文件名查 DATABASECHANGELOG，永远查不到
  #   被 include 文件里的记录；写法须与库里 FILENAME 列一致（classpath 相对路径，UpgradeChangelogTest 守住）。
  #   前置条件不计入校验和，已发布的 13.0-config-settings-to-mediumtext 只加前置条件、不改 changes，存量库校验通过。
  #   逐列拆成独立变更集：MySQL DDL 自动提交，中途失败可从失败的那一列重跑。
  #
  # 二、marketplace_settings_：应用市场账号连接（remote-marketplace C2 / D-C1-1）——
  #   设备授权流令牌与连接账号信息（JSON 串），部署级唯一连接（不落 ujcms_site 行）。
  #   整列 SM4-GCM 加密（config-secrets 约定，Sm4StringTypeHandler 挂在 ConfigMapper.xml），
  #   列宽随之取 MEDIUMTEXT。该列只由 ConfigMapper.updateMarketplaceSettings 单列写入——
  #   令牌在运行期随刷新轮换，不进通用 update/updateBase（后台"全局设置"整行保存
  #   不得用陈旧值复活已作废的 refresh token）。
  #
  # 敏感列（sms/email/*storage/marketplace）的整列 SM4-GCM 加密由 ConfigMapper.xml 的
  # TypeHandler 负责，与本 DDL 无关。

  # ---- 升级路径（表已有行）：逐列搬移 ----
  - changeSet:
      id: 13.0-upgrade-config-upload-settings-to-mediumtext
      author: PONY
      preConditions:
        - onFail: MARK_RAN
        - not:
            - sqlCheck:
                expectedResult: 0
                sql: select count(*) from ujcms_config
        - not:
            - changeSetExecuted:
                changeLogFile: db/changelog/db.changelog-13.0-config.yaml
                id: 13.0-config-settings-to-mediumtext
                author: PONY
      changes:
        - addColumn:
            tableName: ujcms_config
            columns:
              - column:
                  name: upload_settings_tmp_
                  type: MEDIUMTEXT
                  remarks: 上传设置
        - sql:
            sql: update ujcms_config set upload_settings_tmp_ = upload_settings_
        - dropColumn:
            tableName: ujcms_config
            columnName: upload_settings_
        - renameColumn:
            tableName: ujcms_config
            oldColumnName: upload_settings_tmp_
            newColumnName: upload_settings_
            columnDataType: MEDIUMTEXT
            remarks: 上传设置

