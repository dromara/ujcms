databaseChangeLog:
  - changeSet:
      id: 1783247928960-1
      author: PONY
      changes:
        - createTable:
            columns:
              - column:
                  constraints:
                    nullable: false
                    primaryKey: true
                  name: id_
                  remarks: 访谈ID
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
                  name: site_id_
                  remarks: 站点ID
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
