              - column:
                  constraints:
                    nullable: false
                  defaultValueNumeric: 0
                  name: status_
                  remarks: 状态(0:预告,1:直播中,2:已结束)
                  type: SMALLINT
              - column:
                  constraints:
                    nullable: false
                  defaultValue: '0'
                  name: published_
                  remarks: 是否发布
                  type: CHAR(1)
              - column:
                  constraints:
                    nullable: false
                  defaultValue: '1'
                  name: question_enabled_
                  remarks: 是否开放提问
                  type: CHAR(1)
              - column:
                  constraints:
                    nullable: false
                  name: created_
                  remarks: 创建日期
                  type: datetime
              - column:
                  name: text_
                  remarks: 访谈介绍
                  type: MEDIUMTEXT
            remarks: 在线访谈
            tableName: ujcms_interview
