                  type: VARCHAR(450)
              - column:
                  name: image_
                  remarks: 访谈图片
                  type: VARCHAR(255)
              - column:
                  name: org_
                  remarks: 访谈单位
                  type: VARCHAR(300)
              - column:
                  name: host_
                  remarks: 主持人
                  type: VARCHAR(150)
              - column:
                  name: guests_
                  remarks: 访谈嘉宾。格式：姓名（职务），多人以顿号分隔
                  type: VARCHAR(900)
              - column:
