# 首次运行，需要执行以下命令：
# npm --prefix ujcms-starter/src/main/webapp/themes/1/default ci
# npm --prefix ujcms-starter/src/main/webapp/themes/1/default run build:vendor
# pnpm --dir ujcms-ui-console install
# pnpm --dir ujcms-ui-console build:starter
# ./mvnw clean package -DskipTests
# docker compose up -d --build

# 后续运行，如只修改了后端代码和模板文件，只需执行以下命令（模板在卷 ujcms 里，要随镜像更新须开启下方 UJCMS_THEME_SYNC）：
# ./mvnw clean package -DskipTests && docker compose up -d --build

services:

  ujcms:
    # 镜像地址
    # image: dromara/ujcms:latest
    # image: docker.cnb.cool/dromara/ujcms:latest
    # 使用本地编译的代码构建
    build: .
    restart: always
    ports:
      - "8080:8080"
    environment:
      UJCMS_DB_HOST: mysql
      UJCMS_DB_PORT: 3306
      UJCMS_DB_NAME: ujcms
      UJCMS_DB_USER: ujcms
      # 数据库密码与下方 mysql 服务共用同一个变量，可在同目录 .env 文件中覆盖（勿只改其中一处）
      UJCMS_DB_PASSWORD: ${UJCMS_DB_PASSWORD:-my-secret-pw}
      # 安装清单（install-flow §7）：空库首次启动无人值守完成安装，得到可浏览的演示站。
      # 更多变量（站点域名、主题来源、多站点、包库目录摄取等）见 docker/application.yaml 注释；
      # 生产环境建议将管理员密码改经 docker secret 注入（挂载 /run/secrets，见同文件注释），
      # 或安装完成后修改密码。删除 UJCMS_INSTALL_AUTO 则改为访问 /cp/ 走安装向导
      # （安装令牌见容器启动日志）。
      UJCMS_INSTALL_AUTO: "true"
      UJCMS_INSTALL_ADMIN_USERNAME: admin
      UJCMS_INSTALL_ADMIN_PASSWORD: ${UJCMS_INSTALL_ADMIN_PASSWORD:-Ujcms@2026}
      UJCMS_INSTALL_SITES_0_NAME: UJCMS演示站
      # 主题随镜像更新：换镜像后的首次启动用镜像内置的主题目录与主题包覆盖已安装的同名主题实例（见 Dockerfile 注释）。
      # 本机迭代模板或演示 / 测试环境开启；正式站勿开——控制台里改过的模板会被覆盖。
      # UJCMS_THEME_SYNC: "true"
    depends_on:
      mysql:
        condition: service_healthy
        restart: true
    volumes:
      - ujcms:/ujcms/static
      # JVM 类数据共享归档（镜像 CMD 的 -XX:+AutoCreateSharedArchive）：首次正常停止后归档，之后启动快约 1/3；放卷里容器重建不丢
      - cds:/ujcms/cds
    # 内存：不限时 JVM 按宿主机内存的 25% 取堆上限，几个容器就能把小机器挤进 swap。生产环境建议设容器上限并固定堆，例如
    # 2G 上限 + 1G 堆（堆外的元空间 / JIT / 线程栈 / soffice 约需 400～600M）；小机器可再加 -XX:+UseSerialGC（见 Dockerfile 注释）。
    # 两值相等即禁止容器用 swap。
    # deploy:
    #   resources:
    #     limits:
    #       memory: 2048M
    # memswap_limit: 2048M
    # environment:
    #   JAVA_TOOL_OPTIONS: -Xmx1g -Xlog:gc:stdout

  mysql:
    image: mysql:8.4
    restart: always
    # 健康检查必须走 TCP（127.0.0.1）：首次初始化时 MySQL 先启动一个只监听 socket 的临时实例，
    # -h localhost 走 socket，会在建库、建用户完成之前就报告健康，ujcms 随即启动而连不上数据库。
    # ping 只判断服务是否应答（拒绝登录也算应答），无需账号密码。
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s
    environment:
      MYSQL_DATABASE: ujcms
      MYSQL_USER: ujcms
      # 密码只在首次初始化数据卷时生效；已有数据卷后修改这里不会改变数据库中的密码
      MYSQL_PASSWORD: ${UJCMS_DB_PASSWORD:-my-secret-pw}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-my-root-pw}
    volumes:
      - mysql:/var/lib/mysql

volumes:
  ujcms:
  cds:
  mysql:
