name: Publishing image to Docker Hub and GitHub Packages

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# 同版本修复时标签会被删除后重推：取消仍在运行的旧构建，避免它晚于新构建推送而覆盖镜像
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      # 镜像标签阶梯，与 CNB 流水线（.cnb.yml 的 .env_setting）一致：<version>、<major>.<minor> 恒有；
      # 本大版本最新才加 <major>，全局最新才加 latest —— 为旧大版本发补丁时不会把 latest 指回旧版本。
      - name: Resolve image tag ladder
        id: ladder
        run: |
          TAG="${GITHUB_REF_NAME}"
          MAJOR="${TAG#v}"
          MAJOR="${MAJOR%%.*}"
          TAGS=$(git ls-remote --tags --refs origin | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)
          # 当前标签必在远端列表中；不在即 ls-remote 失败，宁可中止也不发布缺 latest / <major> 的镜像
          if ! echo "$TAGS" | grep -Fqx "$TAG"; then
            echo "::error::Tag ${TAG} is not among the remote v<major>.<minor>.<patch> tags; cannot resolve the image tag ladder."
            exit 1
          fi
          LATEST_TAG=$(echo "$TAGS" | tail -n 1)
          LATEST_MAJOR_TAG=$(echo "$TAGS" | grep "^v${MAJOR}\." | tail -n 1)
          echo "LATEST_TAG: ${LATEST_TAG}  LATEST_MAJOR_TAG: ${LATEST_MAJOR_TAG}"
          {
            echo "latest=$([ "$TAG" = "$LATEST_TAG" ] && echo true || echo false)"
            echo "latest_major=$([ "$TAG" = "$LATEST_MAJOR_TAG" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build frontend
        run: |
          THEME=ujcms-starter/src/main/webapp/themes/1/default
          npm --prefix "$THEME" ci
          npm --prefix "$THEME" run build:vendor
          pnpm --dir ujcms-ui-console install --frozen-lockfile
          pnpm --dir ujcms-ui-console build:starter

      - name: Build with Maven
        run: |
          sed -i '/<!-- aliyun-repos begin -->/,/<!-- aliyun-repos end -->/d' pom.xml
          mvn --batch-mode clean package -Dmaven.test.skip=true -Dmaven.javadoc.skip=true

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository }}
            ${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ steps.ladder.outputs.latest_major }}
            type=raw,value=latest,enable=${{ steps.ladder.outputs.latest }}

      - name: Build and push Docker images
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trigger deploy Docker image to server
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          # 响应体含私有部署仓库的构建链接，不写进公开日志，只输出状态码
          curl --fail --silent --show-error --max-time 60 \
            --output /dev/null --write-out 'HTTP %{http_code}\n' \
            --request POST "https://api.cnb.cool/ujcms/deploy/-/build/start" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer ${CNB_TOKEN}" \
            --data '{"event": "api_trigger_deploy"}'
