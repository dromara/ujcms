# 本文件是构建工具 license-maven-plugin 的输入，不是发行版的第三方声明——声明见根目录的 NOTICE 与 licenses/。
# 插件按各依赖 pom 里声明的许可证生成 META-INF/THIRD-PARTY.txt；pom 声明与 jar 内实际附带的许可文件不一致时，
# 以这里为准写入。格式：groupId--artifactId--version=许可证名称。
# 条目绑定版本号：升级这些依赖时须核对新版本 jar 内的 META-INF/license 并同步改这里，否则会退回 pom 里的错误声明。

# 达梦 JDBC 驱动：pom 声明 Apache-2.0，jar 内 META-INF/license.txt 实为达梦专有的 "Dameng JDBC Using License"
#（允许二进制再分发，条件是随发行包附上该许可文本：licenses/Dameng-JDBC.txt）
com.dameng--DmJdbcDriver8--8.1.5.45=Dameng JDBC Using License

# 瀚高 JDBC 驱动：pom 声明 Apache-2.0，jar 内 META-INF/LICENSE 为 PostgreSQL（BSD-2-Clause）许可
com.highgo--HgdbJdbc--6.2.5=BSD-2-Clause

# MariaDB Connector/J（MySQL 与 MariaDB 共用的驱动）：LGPL-2.1。作为未经修改、可单独替换的独立 jar 随发行包分发是允许的
#（NOTICE「Libraries in binary distributions」一节）。includedLicenses 只放行这个带说明的名称，新引入的其它 LGPL 构件仍会使
# 构建失败，须逐个评估后在此登记。版本号与根 pom 的 mariadb.version 同步改
org.mariadb.jdbc--mariadb-java-client--3.5.10=LGPL-2.1 (accepted: unmodified, separately replaceable jar)
