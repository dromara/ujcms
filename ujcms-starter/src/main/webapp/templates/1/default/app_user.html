[#escape x as (x)!?html]
  [#if user??]
  <div class="d-none d-xl-flex align-items-center">
    <a class="ms-3 position-relative text-secondary" href="${def}/settings/notification" title="通知">
      <i class="far fa-bell fa-lg"></i>
      <span id="headerNotificationCount" class="badge rounded-pill bg-danger position-absolute top-0 start-100 translate-middle d-none"></span>
    </a>
    <div class="dropdown ms-3">
      <span class="d-inline-block position-relative" data-bs-toggle="dropdown" style="cursor:pointer;">
        <img src="${user.smallAvatar!config.register.avatar}" alt="${user.username}" title="${user.username}" class="rounded-circle"
             style="width:36px;height:36px;">
        <span id="headerAvatarDot" class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle d-none">
          <span class="visually-hidden">有未读消息</span></span>
      </span>
      <div class="dropdown-menu dropdown-menu-end">
        <a class="dropdown-item" href="${def}${user.homepage}"><i class="far fa-user"></i> <span>个人主页</span></a>
        <a class="dropdown-item" href="${def}/settings"><i class="fas fa-tachometer-alt"></i> <span>个人中心</span></a>
        <a class="dropdown-item" href="${def}/settings/favorite"><i class="far fa-star"></i> <span>我的收藏</span></a>
        <a class="dropdown-item d-flex justify-content-between align-items-center" href="${def}/settings/message">
          <span><i class="far fa-envelope"></i> 我的私信</span>
          <span id="headerMessageBadge" class="badge bg-danger rounded-pill d-none"></span></a>
        <a class="dropdown-item d-flex justify-content-between align-items-center" href="${def}/settings/notification">
          <span><i class="far fa-bell"></i> 通知</span>
          <span id="headerNotificationBadge" class="badge bg-danger rounded-pill d-none"></span></a>
        <a class="dropdown-item" href="${def}/settings/profile"><i class="fas fa-cog"></i> <span>设置</span></a>
        <form action="${ctx}/logout" method="post">
          <button class="dropdown-item" type="submit"><i class="fas fa-sign-out-alt"></i> <span>退出</span></button>
          <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}">
        </form>
      </div>
    </div>
  </div>
  <script>
    (function () {
      // 全站唯一的未读计数轮询：头部铃铛/下拉徽章、头像红点，以及个人中心左侧导航徽章（若在当前页面）
      // 均由此驱动，避免设置页与头部重复轮询。#settings* 元素不存在时 jQuery 静默忽略。失败静默忽略。
      var notifUnread = 0, msgUnread = 0;

      function updateAvatarDot() {
        $('#headerAvatarDot').toggleClass('d-none', (notifUnread + msgUnread) <= 0);
      }

      function refreshHeaderCounts() {
        axios.get('${api}/notification/unread-count').then(function (response) {
          notifUnread = Number(response.data) || 0;
          var text = notifUnread > 99 ? '99+' : notifUnread;
          $('#headerNotificationCount, #headerNotificationBadge, #settingsNotificationBadge')
                  .text(text).toggleClass('d-none', notifUnread <= 0);
          updateAvatarDot();
        }).catch(function () {
        });
        axios.get('${api}/conversation/unread-count').then(function (response) {
          msgUnread = Number(response.data) || 0;
          var text = msgUnread > 99 ? '99+' : msgUnread;
          $('#headerMessageBadge, #settingsMessageBadge').text(text).toggleClass('d-none', msgUnread <= 0);
          updateAvatarDot();
        }).catch(function () {
        });
      }

      refreshHeaderCounts();
      setInterval(refreshHeaderCounts, 60000);
    })();
  </script>
  [#else]
  <div class="ms-3">
    <a class="btn btn-light text-primary" href="${def}/login">登录</a>
    <a class="btn btn-primary" href="${def}/register">注册</a>
  </div>
  [/#if]
[/#escape]
