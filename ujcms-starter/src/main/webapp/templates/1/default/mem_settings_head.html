[#escape x as (x)!?html]
  <meta name="_csrf" content="${_csrf.token}">
  <meta name="_csrf_header" content="${_csrf.headerName}">
  <style>
    /* 个人中心各页共享的卡片骨架与空状态样式 */
    .settings-card {
      border: 0;
      border-radius: .5rem;
      box-shadow: 0 .125rem .25rem rgba(0, 0, 0, .075);
      margin-bottom: 1rem;
    }
    .settings-card > .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: transparent;
      border-bottom: 1px solid rgba(0, 0, 0, .08);
      font-weight: 600;
    }
    .settings-page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      padding-bottom: .75rem;
      border-bottom: 1px solid var(--bs-border-color, #dee2e6);
      font-size: 1.35rem;
      font-weight: 600;
    }
    .settings-empty {
      text-align: center;
      color: var(--bs-secondary-color, #6c757d);
      padding: 3rem 1rem;
    }
    .settings-empty i {
      display: block;
      margin-bottom: .75rem;
      font-size: 2.5rem;
      opacity: .35;
    }
    /* 左侧导航图标定宽对齐 */
    .settings-nav-icon {
      width: 1.25rem;
      margin-right: .35rem;
      text-align: center;
    }
    /* 统计磁贴悬浮反馈 */
    .settings-tile {
      transition: box-shadow .15s ease-in-out, transform .15s ease-in-out;
    }
    .settings-tile:hover {
      transform: translateY(-2px);
      box-shadow: 0 .25rem .5rem rgba(0, 0, 0, .1);
    }
    .settings-tile .settings-tile-num {
      font-size: 1.6rem;
      font-weight: 600;
      line-height: 1.2;
    }
  </style>
[/#escape]
