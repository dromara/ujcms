# 注意，所有配置名冒号后必须保留一个英文空格，否则启动项目会报错。
# 例如：`spring.datasource.username:root`是非法配置，`spring.datasource.username: root`才是合法配置。

# 数据库连接 URL（MySQL 与 MariaDB 都用 MariaDB Connector/J 驱动连接，URL 一律写 `jdbc:mariadb://`）
# `127.0.0.1` 是数据库的IP地址，数据库安装在本机可直接用 `127.0.0.1`，如安装在其它服务器，则填写相应 IP，如 `192.168.0.1`。
# `3306` 是数据库端口号，MySQL默认端口号就是 `3306`，如安装数据库时，没有手动修改过端口号，则无需修改。
# `ujcms` 是数据库名，即创建数据库时，所填的数据库名。
# `allowPublicKeyRetrieval=true`：MySQL 8 默认的 caching_sha2_password 认证在未加密的连接上要向服务器索取 RSA 公钥，
#   不加会在服务器重启后的首次连接报 "RSA public key is not available client side"。改用 TLS 加密连接时可去掉。
# `allowLocalInfile=false`：禁止服务器要求客户端上传本机文件（LOAD DATA LOCAL INFILE）。不要改动。
# `nullDatabaseMeansCurrent=true`：JDBC 元数据查询不带库名时只看当前库。工作流引擎建表前这样检查表是否存在，不加它时同一服务器上
#   其它库里的同名表会被当成已存在，空库首次启动即失败。不要改动。
# 可选参数：加密连接 `sslMode=trust`（只加密，不校验证书）或 `sslMode=verify-full`；排序规则 `connectionCollation=utf8mb4_unicode_ci`。
# 时区：驱动按 JVM 时区读写时间，模板也按 JVM 时区格式化时间，请保证 JVM 时区正确（容器镜像已设 TZ=Asia/Shanghai；
#   裸机用系统时区或 -Duser.timezone=Asia/Shanghai）。MySQL Connector/J 的 serverTimezone、characterEncoding 等参数不再需要，写了也会被忽略。
spring.datasource.url: jdbc:mariadb://127.0.0.1:3306/ujcms?allowPublicKeyRetrieval=true&allowLocalInfile=false&nullDatabaseMeansCurrent=true
# 数据库用户名（注意：所有配置名的冒号后必须保留一个英文空格）
spring.datasource.username: root
# 数据库密码（注意：所有配置名的冒号后必须保留一个英文空格）
spring.datasource.password: password
# 数据库驱动。常用数据库（如 MySQL / MariaDB、PostgreSQL）可通过 jdbc url 自动判断，不用指定。无法自动判断时（如国产数据库），需要手动指定。
#spring.datasource.driver-class-name: org.mariadb.jdbc.Driver
# 数据库类型（用于数据库备份）。支持 mysql（MariaDB 也填 mysql）、postgresql、kingbase、opengauss
ujcms.database-type: mysql
# 数据库命令所在目录（用于数据库备份）。如果已加入环境变量则留空即可。
ujcms.database-bin-path:

